<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Inteligente de Estacionamiento</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #333; }
        input[type="file"] { margin: 20px 0; }
        button { background: #0070f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #005bb5; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 18px; }
        .ocupado { color: #d32f2f; }
        .disponible { color: #388e3c; }
        img#preview { max-width: 100%; margin-top: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Monitor ViT-B/16</h2>
        <p>Sube la foto del cajón de estacionamiento</p>
        
        <input type="file" id="imageInput" accept="image/jpeg, image/png">
        <br>
        <img id="preview" alt="Vista previa">
        <br><br>
        <button onclick="analizarImagen()">Analizar Ocupación</button>

        <div id="resultado"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        // Mostrar vista previa de la foto
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        async function analizarImagen() {
            const file = imageInput.files[0];
            if (!file) {
                alert("Por favor, selecciona una imagen primero.");
                return;
            }

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "⏳ Analizando con IA...";
            resultadoDiv.className = "";

            const formData = new FormData();
            formData.append("file", file);

            try {
                // AQUÍ VA LA URL DE TU BACKEND EN PRODUCCIÓN O LOCALHOST
                const response = await fetch("http://localhost:8000/predict", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                
                resultadoDiv.innerHTML = `Estado: ${data.estado} <br> <span style="font-size: 14px; color: #666;">Confianza: ${data.confianza}%</span>`;
                resultadoDiv.className = data.estado === "Ocupado" ? "ocupado" : "disponible";

            } catch (error) {
                resultadoDiv.innerHTML = "❌ Error al conectar con el servidor.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
