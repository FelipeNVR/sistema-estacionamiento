<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Inteligente de Estacionamiento</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h2 { color: #333; margin-bottom: 5px; }
        .config-box { background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 12px; text-align: left; }
        input[type="text"] { width: 95%; padding: 5px; margin-top: 5px; }
        input[type="file"] { margin: 15px 0; }
        button { background: #0070f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #005bb5; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 18px; }
        .ocupado { color: #d32f2f; }
        .disponible { color: #388e3c; }
        img#preview { max-width: 100%; margin-top: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Monitor ViT-B/16</h2>

        <div class="config-box">
            <label>🔌 Conexión a la API (Backend):</label>
            <input type="text" id="apiUrl" value="http://localhost:8000/predict">
        </div>

        <p>Sube la foto del cajón de estacionamiento</p>
        <input type="file" id="imageInput" accept="image/jpeg, image/png">
        <img id="preview" alt="Vista previa">
        <br><br>
        <button onclick="analizarImagen()">Analizar Ocupación</button>
        <div id="resultado"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; }
                reader.readAsDataURL(file);
            }
        });

        async function analizarImagen() {
            const file = imageInput.files[0];
            const apiUrl = document.getElementById('apiUrl').value;
            if (!file) return alert("Selecciona una imagen primero.");

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "⏳ Procesando en Docker...";
            resultadoDiv.className = "";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch(apiUrl, { method: "POST", body: formData });
                if (!response.ok) throw new Error("Error de red");
                const data = await response.json();

                resultadoDiv.innerHTML = `Estado: ${data.estado} <br> <span style="font-size: 14px; color: #666;">Confianza: ${data.confianza}%</span>`;
                resultadoDiv.className = data.estado === "Ocupado" ? "ocupado" : "disponible";
            } catch (error) {
                resultadoDiv.innerHTML = "❌ Servidor no disponible.";
            }
        }
    </script>
</body>
</html>
